<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse | Social Search & Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --secondary: #06b6d4;
            --accent: #f43f5e;
            --accent-light: #fff1f2;
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-secondary: #f1f5f9;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --composer-bg: #ffffff;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --chip-bg: rgba(255, 255, 255, 0.15);
        }

        [data-theme="dark"] {
            --bg: #090d16;
            --surface: #131c2e;
            --surface-secondary: #1e293b;
            --border: #243046;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-light: rgba(79, 70, 229, 0.2);
            --accent-light: rgba(244, 63, 94, 0.15);
            --composer-bg: #131c2e;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
            --nav-bg: rgba(19, 28, 46, 0.85);
            --chip-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
            padding-bottom: 3rem;
        }

        /* Top Navbar */
        .navbar {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            -webkit-text-fill-color: initial;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .theme-toggle:hover {
            transform: scale(1.08);
            background: var(--surface-secondary);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            background: var(--surface);
            padding: 0.3rem 0.5rem 0.3rem 0.65rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }

        /* Avatar Container & Image */
        .avatar-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--surface-secondary);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .avatar-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
        }

        /* Container */
        .container {
            max-width: 680px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Utilities */
        .hidden { display: none !important; }
        .flex { display: flex; align-items: center; gap: 0.5rem; }
        .space-between { justify-content: space-between; }

        /* Auth Screen */
        .auth-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 2.25rem 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            max-width: 440px;
            margin: 2.5rem auto;
            text-align: center;
        }

        .auth-tabs {
            display: flex;
            background: var(--surface-secondary);
            border-radius: var(--radius-sm);
            padding: 0.25rem;
            margin-bottom: 1.5rem;
            gap: 0.25rem;
        }

        .auth-tab {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* Inputs & Buttons */
        .form-group {
            text-align: left;
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.7rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--surface-secondary);
        }

        .btn-danger {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }
        .btn-danger:hover {
            background: rgba(244, 63, 94, 0.25);
        }

        .btn-full { width: 100%; }

        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        /* Demo Account Quick Pickers */
        .demo-accounts {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            text-align: left;
        }

        .demo-accounts-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.65rem;
            letter-spacing: 0.5px;
        }

        .demo-pill-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .demo-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--surface-secondary);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.25rem 0.6rem 0.25rem 0.35rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-pill:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* Explore Members Header Widget */
        .members-strip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow-x: auto;
            box-shadow: var(--shadow-sm);
        }

        .members-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .member-avatar-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.6rem 0.25rem 0.3rem;
            background: var(--surface-secondary);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .member-avatar-chip:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        /* Trending Section */
        .trending-card {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
            border-radius: var(--radius-md);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        [data-theme="dark"] .trending-card {
            background: linear-gradient(135deg, #131438, #1e1b4b);
            border: 1px solid var(--border);
        }

        .trending-card::after {
            content: "🔥";
            position: absolute;
            right: 1.2rem;
            top: 1rem;
            font-size: 2.5rem;
            opacity: 0.15;
        }

        .trending-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .chip {
            background: var(--chip-bg);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .chip-count {
            background: rgba(0, 0, 0, 0.3);
            font-size: 0.72rem;
            padding: 0.1rem 0.45rem;
            border-radius: 999px;
            color: #e0e7ff;
        }

        /* Create Post Card */
        .composer-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.25rem;
        }

        /* Search Bar */
        .search-box {
            display: flex;
            gap: 0.5rem;
            background: var(--surface);
            padding: 0.35rem 0.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.25rem;
            align-items: center;
        }

        .search-box input {
            border: none;
            box-shadow: none;
            padding: 0.5rem 0.75rem;
            background: transparent;
        }
        .search-box input:focus {
            box-shadow: none;
            border: none;
        }

        /* Post Card */
        .post-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            padding: 1.4rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.25rem;
            transition: all 0.2s ease;
        }

        .post-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }
        [data-theme="dark"] .post-card:hover {
            border-color: #384860;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.85rem;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            cursor: pointer;
        }

        .author-meta {
            line-height: 1.2;
        }

        .author-name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .author-name:hover {
            color: var(--primary);
        }

        .post-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .post-content {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 0.85rem;
            word-break: break-word;
            line-height: 1.6;
        }

        .post-hashtag {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            background: var(--primary-light);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-size: 0.85rem;
            display: inline-block;
            margin: 0.2rem 0.2rem 0.2rem 0;
            transition: all 0.2s;
        }
        .post-hashtag:hover {
            background: #e0e7ff;
            color: var(--primary-hover);
        }

        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 0.85rem;
            margin-top: 0.85rem;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.4rem 0.7rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--surface-secondary);
            color: var(--text-main);
        }

        .action-btn.liked {
            color: var(--accent);
            background: var(--accent-light);
        }

        /* Comments */
        .comments-section {
            background: var(--surface-secondary);
            border-radius: var(--radius-sm);
            padding: 0.85rem;
            margin-top: 0.85rem;
            border: 1px solid var(--border);
        }

        .comment-item {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.65rem;
            font-size: 0.88rem;
        }

        .comment-bubble {
            background: var(--surface);
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            flex: 1;
        }

        .comment-author {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.82rem;
            cursor: pointer;
        }
        .comment-author:hover {
            color: var(--primary);
        }

        .comment-text {
            color: var(--text-main);
            margin-top: 0.15rem;
        }

        /* Profile Banner */
        .profile-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 1.75rem;
            position: relative;
        }

        .profile-banner {
            height: 90px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px 12px 0 0;
            margin: -2rem -2rem 1.5rem -2rem;
        }

        .profile-avatar-wrap {
            margin-top: -65px;
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-end;
            gap: 1.25rem;
            position: relative;
        }

        .profile-avatar-box {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 4px solid var(--surface);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            background: var(--surface);
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .profile-bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.4rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        /* Avatar Editor Box */
        .avatar-edit-box {
            background: var(--surface-secondary);
            border: 1px dashed var(--border);
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header class="navbar">
        <div class="brand" onclick="showFeed()">
            <div class="brand-icon">⚡</div>
            <span>Pulse</span>
        </div>
        <div class="nav-right">
            <!-- Theme Toggle -->
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                🌙
            </button>

            <!-- User Status Pill -->
            <div id="nav-user-actions" class="hidden">
                <div class="user-pill" onclick="showProfile(currentUser._id)">
                    <div id="navAvatarBox" class="avatar-wrap" style="width: 32px; height: 32px;"></div>
                    <span id="currentUserName" style="font-weight: 700; font-size: 0.88rem;"></span>
                    <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); logout();">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">

        <!-- Login / Register Card -->
        <section id="login-view" class="auth-card">
            <div style="font-size: 2.2rem; margin-bottom: 0.4rem;">👋</div>
            <h2 id="authHeading">Welcome Back</h2>
            <p class="subtitle" id="authSubheading">Sign in to search, discover, and share thoughts</p>

            <!-- Tabs: Sign In vs Sign Up -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
                <button class="auth-tab" id="tabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
            </div>

            <!-- Sign In Form -->
            <div id="signInForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="e.g. anaushka" value="anaushka">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" value="password123">
                </div>

                <button class="btn btn-primary btn-full" onclick="login()">Sign In</button>
            </div>

            <!-- Sign Up Form -->
            <div id="signUpForm" class="hidden">
                <div class="form-group">
                    <label>Choose Username</label>
                    <input type="text" id="regUsername" placeholder="e.g. alex_dev">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="text" id="regEmail" placeholder="e.g. alex@example.com">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password">
                </div>

                <div class="form-group">
                    <label>Short Bio (Optional)</label>
                    <input type="text" id="regBio" placeholder="e.g. NoSQL geek & full stack dev">
                </div>

                <button class="btn btn-primary btn-full" onclick="register()">Create & Join</button>
            </div>

            <p id="loginError" style="color: var(--accent); font-size: 0.85rem; margin-top: 0.75rem; font-weight: 600;"></p>
        </section>

        <!-- Main Feed Screen -->
        <div id="app-view" class="hidden">

            <!-- Profile View -->
            <section id="profile-section" class="hidden profile-card">
                <div class="profile-banner"></div>
                <div class="profile-avatar-wrap">
                    <div class="profile-avatar-box" id="profileAvatarBox"></div>
                    <div>
                        <h2 class="profile-name" id="profileUsername"></h2>
                        <span id="profileEmail" style="color: var(--text-muted); font-size: 0.85rem;"></span>
                    </div>
                </div>
                <p class="profile-bio" id="profileBio"></p>

                <!-- Avatar Edit Tool (only visible if viewing your own profile) -->
                <div id="ownProfileEditor" class="avatar-edit-box hidden">
                    <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">Update Profile Picture</span>
                    <div class="flex" style="margin-top: 0.5rem;">
                        <input type="text" id="newAvatarUrl" placeholder="Paste image URL (or avatar will auto-pick)" style="margin-bottom:0;">
                        <button class="btn btn-primary btn-sm" onclick="saveAvatar()" style="white-space: nowrap;">Save Photo</button>
                    </div>
                </div>

                <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                    <button class="btn btn-secondary btn-sm" onclick="showFeed()">← Back to Feed</button>
                </div>
            </section>

            <!-- Global Feed (Members + Trends + Composer + Search) -->
            <div id="feed-components">

                <!-- Explore Members Strip -->
                <div class="members-strip">
                    <span class="members-label">👥 Community:</span>
                    <div class="flex" id="membersListContainer">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <!-- Trending Tags -->
                <section class="trending-card">
                    <div class="trending-title">
                        <span>⚡ Trending Today</span>
                    </div>
                    <div class="chips-wrap" id="tags-container">
                        <span style="font-size: 0.85rem; opacity: 0.7;">Loading trends...</span>
                    </div>
                </section>

                <!-- Create Post -->
                <section class="composer-card">
                    <div style="display: flex; gap: 0.75rem; margin-bottom: 0.75rem;">
                        <div id="composerAvatarBox" class="avatar-wrap" style="width: 38px; height: 38px;"></div>
                        <textarea id="postContent" placeholder="What's happening? Include #hashtags to trend..."></textarea>
                    </div>

                    <!-- Image / Media Preview Container -->
                    <div id="mediaPreviewContainer" class="hidden" style="position: relative; margin-bottom: 0.75rem; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); max-height: 280px; background: var(--surface-secondary);">
                        <img id="mediaPreviewImg" src="" style="width: 100%; max-height: 280px; object-fit: contain; display: block;" alt="Upload Preview">
                        <button onclick="clearSelectedMedia()" style="position: absolute; top: 8px; right: 8px; width: auto; background: rgba(0,0,0,0.65); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin: 0;">✕ Remove</button>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="flex">
                            <label for="mediaFileInput" class="btn btn-secondary btn-sm" style="cursor: pointer; margin: 0; display: inline-flex; align-items: center; gap: 0.35rem;">
                                📷 <span>Add Photo</span>
                            </label>
                            <input type="file" id="mediaFileInput" accept="image/*" style="display: none;" onchange="handleMediaSelect(event)">
                            <span id="mediaFileName" style="font-size: 0.78rem; color: var(--text-muted);"></span>
                        </div>
                        <button class="btn btn-primary" onclick="createPost()">Publish Post</button>
                    </div>
                </section>

                <!-- Search -->
                <div class="search-box">
                    <span style="padding-left: 0.5rem; color: var(--text-muted);">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search by #hashtag or keyword..." onkeyup="if(event.key==='Enter') searchPosts()">
                    <button class="btn btn-primary btn-sm" onclick="searchPosts()">Search</button>
                    <button class="btn btn-secondary btn-sm" id="clearSearchBtn" onclick="clearSearch()" style="display: none;">Clear</button>
                </div>
            </div>

            <!-- Posts Feed -->
            <div id="posts-container"></div>
        </div>

    </main>

    <script>
        const API = 'http://localhost:3000/api';
        let currentUser = null;
        let viewedUserId = null;
        let allUsers = [];

        // THEME MANAGEMENT
        function initTheme() {
            const savedTheme = localStorage.getItem('pulse_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            setTheme(theme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('pulse_theme', theme);
            const btn = document.getElementById('themeToggleBtn');
            btn.innerText = theme === 'dark' ? '☀️' : '🌙';
            btn.title = theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
        }

        // AUTH TABS
        function switchAuthTab(tab) {
            const isSignIn = tab === 'signin';
            document.getElementById('tabSignIn').classList.toggle('active', isSignIn);
            document.getElementById('tabSignUp').classList.toggle('active', !isSignIn);
            document.getElementById('signInForm').classList.toggle('hidden', !isSignIn);
            document.getElementById('signUpForm').classList.toggle('hidden', isSignIn);

            document.getElementById('authHeading').innerText = isSignIn ? 'Welcome Back' : 'Join Pulse';
            document.getElementById('authSubheading').innerText = isSignIn 
                ? 'Sign in to search, discover, and share thoughts' 
                : 'Create your account to start sharing and trending';
            document.getElementById('loginError').innerText = '';
        }

        // AVATAR GENERATION & FALLBACKS
        const avatarColors = ['#4f46e5', '#06b6d4', '#ec4899', '#8b5cf6', '#10b981', '#f59e0b', '#3b82f6'];
        function getAvatarColor(name = 'U') {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function renderAvatar(userOrName, size = '36px', fontSize = '0.85rem') {
            const username = typeof userOrName === 'string' ? userOrName : (userOrName?.username || 'U');
            const avatarUrl = typeof userOrName === 'object' ? userOrName?.avatar : null;
            const initial = (username[0] || 'U').toUpperCase();
            const bg = getAvatarColor(username);

            if (avatarUrl) {
                return `
                <div class="avatar-wrap" style="width: ${size}; height: ${size};">
                    <img src="${avatarUrl}" class="avatar-img" alt="${username}" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="avatar-fallback" style="display: none; background: ${bg}; font-size: ${fontSize};">
                        ${initial}
                    </div>
                </div>`;
            } else {
                return `
                <div class="avatar-wrap" style="width: ${size}; height: ${size};">
                    <div class="avatar-fallback" style="background: ${bg}; font-size: ${fontSize};">
                        ${initial}
                    </div>
                </div>`;
            }
        }

        // FETCH ALL USERS FOR COMMUNITY BAR
        async function fetchAllUsers() {
            try {
                const res = await fetch(`${API}/users`);
                allUsers = await res.json();
                renderMembersBar();
            } catch (e) {
                console.error('Could not fetch user list:', e);
            }
        }

        function renderMembersBar() {
            const container = document.getElementById('membersListContainer');
            if (!container) return;
            container.innerHTML = allUsers.map(u => `
                <div class="member-avatar-chip" onclick="showProfile('${u._id}')">
                    ${renderAvatar(u, '24px', '0.7rem')}
                    <span>@${u.username}</span>
                </div>
            `).join('');
        }

        // AUTHENTICATION
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.innerText = '';

            try {
                const res = await fetch(`${API}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Invalid username or password');
                currentUser = data;
                
                // UI transition
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('nav-user-actions').classList.remove('hidden');
                
                document.getElementById('currentUserName').innerText = currentUser.username;
                updateHeaderAndComposerAvatars();

                showFeed();
            } catch (err) {
                errorEl.innerText = err.message;
            }
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const bio = document.getElementById('regBio').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.innerText = '';

            if (!username || !email || !password) {
                errorEl.innerText = 'Please fill out username, email, and password.';
                return;
            }

            try {
                const res = await fetch(`${API}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, bio })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Registration failed');
                
                // Automatically log in as the newly created user!
                currentUser = data;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('nav-user-actions').classList.remove('hidden');
                
                document.getElementById('currentUserName').innerText = currentUser.username;
                updateHeaderAndComposerAvatars();
                fetchAllUsers(); // update community list
                showFeed();
            } catch (err) {
                errorEl.innerText = err.message;
            }
        }

        function updateHeaderAndComposerAvatars() {
            if (!currentUser) return;
            document.getElementById('navAvatarBox').innerHTML = renderAvatar(currentUser, '32px', '0.8rem');
            document.getElementById('composerAvatarBox').innerHTML = renderAvatar(currentUser, '38px', '0.9rem');
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('nav-user-actions').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            switchAuthTab('signin');
        }

        // VIEWS
        function showFeed() {
            viewedUserId = null;
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('feed-components').classList.remove('hidden');
            loadTrending();
            loadPosts();
        }

        async function showProfile(userId) {
            viewedUserId = userId;
            document.getElementById('feed-components').classList.add('hidden');
            const profileSection = document.getElementById('profile-section');
            profileSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const res = await fetch(`${API}/users/${userId}`);
                const user = await res.json();
                
                document.getElementById('profileUsername').innerText = `@${user.username}`;
                document.getElementById('profileEmail').innerText = user.email;
                document.getElementById('profileBio').innerText = user.bio || 'No bio provided yet.';
                
                document.getElementById('profileAvatarBox').innerHTML = renderAvatar(user, '84px', '2rem');

                // If viewing own profile, show editor
                const isOwnProfile = currentUser && currentUser._id === userId;
                const editorBox = document.getElementById('ownProfileEditor');
                if (isOwnProfile) {
                    editorBox.classList.remove('hidden');
                    document.getElementById('newAvatarUrl').value = user.avatar || '';
                } else {
                    editorBox.classList.add('hidden');
                }

                const postsRes = await fetch(`${API}/users/${userId}/posts`);
                const posts = await postsRes.json();
                displayPosts(posts);
            } catch (e) {
                console.error(e);
            }
        }

        async function saveAvatar() {
            let newUrl = document.getElementById('newAvatarUrl').value.trim();
            if (!newUrl) {
                newUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${currentUser.username}_${Date.now()}`;
                document.getElementById('newAvatarUrl').value = newUrl;
            }

            try {
                const res = await fetch(`${API}/users/${currentUser._id}/avatar`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ avatar: newUrl })
                });
                const updatedUser = await res.json();
                currentUser.avatar = updatedUser.avatar;
                updateHeaderAndComposerAvatars();
                fetchAllUsers();
                showProfile(currentUser._id);
            } catch (err) {
                alert('Could not update avatar: ' + err.message);
            }
        }

        // TRENDING
        async function loadTrending() {
            try {
                const res = await fetch(`${API}/search/trending`);
                const tags = await res.json();
                const container = document.getElementById('tags-container');
                container.innerHTML = '';
                
                if (tags.length === 0) {
                    container.innerHTML = '<span style="font-size:0.85rem; opacity:0.8;">No trending hashtags yet today!</span>';
                    return;
                }

                tags.forEach(t => {
                    const span = document.createElement('span');
                    span.className = 'chip';
                    span.innerHTML = `<span>${t.value}</span> <span class="chip-count">${t.score}</span>`;
                    span.onclick = () => {
                        const cleanTag = t.value.replace('#', '');
                        document.getElementById('searchInput').value = cleanTag;
                        searchPosts();
                    };
                    container.appendChild(span);
                });
            } catch (err) {
                console.error(err);
            }
        }

        let selectedMediaData = null;

        function handleMediaSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Check file size (max 8MB for standard inline BSON document)
            if (file.size > 8 * 1024 * 1024) {
                alert('File is too large. Please select an image under 8MB.');
                e.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedMediaData = {
                    url: evt.target.result,
                    mediaType: file.type || 'image/jpeg',
                    caption: file.name
                };
                document.getElementById('mediaPreviewImg').src = selectedMediaData.url;
                document.getElementById('mediaPreviewContainer').classList.remove('hidden');
                document.getElementById('mediaFileName').innerText = file.name;
            };
            reader.readAsDataURL(file);
        }

        function clearSelectedMedia() {
            selectedMediaData = null;
            document.getElementById('mediaFileInput').value = '';
            document.getElementById('mediaPreviewImg').src = '';
            document.getElementById('mediaPreviewContainer').classList.add('hidden');
            document.getElementById('mediaFileName').innerText = '';
        }

        // POSTS
        async function loadPosts() {
            try {
                const res = await fetch(`${API}/posts`);
                const posts = await res.json();
                displayPosts(posts);
            } catch (err) {
                console.error(err);
            }
        }

        async function createPost() {
            const content = document.getElementById('postContent').value.trim();
            if (!content && !selectedMediaData) return;

            try {
                await fetch(`${API}/posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        content: content || 'Shared a photo', 
                        userId: currentUser._id,
                        media: selectedMediaData
                    })
                });
                document.getElementById('postContent').value = '';
                clearSelectedMedia();
                loadTrending();
                loadPosts();
            } catch (err) {
                console.error(err);
            }
        }

        async function searchPosts() {
            const tag = document.getElementById('searchInput').value.trim();
            const clearBtn = document.getElementById('clearSearchBtn');
            
            if (!tag) {
                clearSearch();
                return;
            }

            clearBtn.style.display = 'inline-block';
            try {
                const res = await fetch(`${API}/search?tag=${encodeURIComponent(tag)}`);
                const posts = await res.json();
                displayPosts(posts);
            } catch (err) {
                console.error(err);
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            loadPosts();
        }

        async function likePost(id) {
            if (!currentUser) {
                alert('Please sign in to like posts!');
                return;
            }
            try {
                await fetch(`${API}/posts/${id}/like`, { 
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser._id })
                });
                refreshCurrentView();
            } catch (err) {
                console.error(err);
            }
        }

        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            try {
                await fetch(`${API}/posts/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser._id })
                });
                loadTrending();
                refreshCurrentView();
            } catch (err) {
                console.error(err);
            }
        }

        // COMMENTS
        async function addComment(postId) {
            const input = document.getElementById(`commentInput-${postId}`);
            const content = input.value.trim();
            if (!content) return;

            try {
                await fetch(`${API}/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser._id, content })
                });
                input.value = '';
                refreshCurrentView();
            } catch (err) {
                console.error(err);
            }
        }

        function refreshCurrentView() {
            if (viewedUserId) {
                showProfile(viewedUserId);
            } else {
                const tag = document.getElementById('searchInput').value.trim();
                if (tag) searchPosts(); else loadPosts();
            }
        }

        function formatContentWithHashtags(text) {
            return text.replace(/#(\w+)/g, (match, tag) => {
                return `<span class="post-hashtag" onclick="event.stopPropagation(); document.getElementById('searchInput').value='${tag}'; searchPosts();">${match}</span>`;
            });
        }

        function displayPosts(posts) {
            const container = document.getElementById('posts-container');
            if (!posts || posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📭</div>
                        <p style="font-weight: 600;">No posts found</p>
                        <span style="font-size: 0.85rem;">Be the first to share something or try a different search.</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(p => {
                const author = p.userId || { username: 'Unknown', _id: null, avatar: '' };
                const authorName = author.username || 'Unknown';
                const authorId = author._id || '';
                const canDelete = currentUser && authorId && authorId === currentUser._id;
                
                const timeString = p.createdAt ? new Date(p.createdAt).toLocaleDateString(undefined, {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                }) : '';

                const commentsHtml = (p.comments || []).map(c => {
                    const cAuthor = c.userId || { username: 'Unknown', _id: null, avatar: '' };
                    const cName = cAuthor.username || 'Unknown';
                    const cId = cAuthor._id || '';
                    return `
                    <div class="comment-item">
                        ${renderAvatar(cAuthor, '26px', '0.7rem')}
                        <div class="comment-bubble">
                            <span class="comment-author" onclick="showProfile('${cId}')">@${cName}</span>
                            <div class="comment-text">${c.content}</div>
                        </div>
                    </div>
                    `;
                }).join('');

                const isLiked = currentUser && (p.likedBy || []).some(id => (id._id || id).toString() === currentUser._id.toString());

                return `
                <article class="post-card">
                    <div class="post-header">
                        <div class="author-info" onclick="showProfile('${authorId}')">
                            ${renderAvatar(author, '38px', '0.85rem')}
                            <div class="author-meta">
                                <div class="author-name">@${authorName}</div>
                                <div class="post-time">${timeString}</div>
                            </div>
                        </div>
                        ${canDelete ? `
                            <button class="btn btn-danger btn-sm" onclick="deletePost('${p._id}')" title="Delete your post">
                                🗑️ Delete
                            </button>
                        ` : ''}
                    </div>

                    <div class="post-content">
                        ${formatContentWithHashtags(p.content)}
                    </div>

                    ${p.media && p.media.url ? `
                        <div style="margin: 0.85rem 0; border-radius: 12px; overflow: hidden; max-height: 420px; background: var(--surface-secondary); border: 1px solid var(--border);">
                            <img src="${p.media.url}" alt="${p.media.caption || 'Post attachment'}" style="width: 100%; max-height: 420px; object-fit: cover; display: block;" onerror="this.parentElement.style.display='none';">
                        </div>
                    ` : ''}

                    <div class="post-actions">
                        <div class="action-group">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="likePost('${p._id}')" title="${isLiked ? 'Unlike' : 'Like'}">
                                <span>${isLiked ? '❤️' : '🤍'}</span>
                                <span>${p.likes || 0}</span>
                            </button>
                            <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 0.5rem;">
                                💬 ${(p.comments || []).length} replies
                            </span>
                        </div>
                    </div>

                    <div class="comments-section">
                        <div id="comments-list-${p._id}">
                            ${commentsHtml}
                        </div>
                        <div class="flex" style="margin-top: 0.65rem;">
                            <input type="text" id="commentInput-${p._id}" placeholder="Write a reply..." onkeyup="if(event.key==='Enter') addComment('${p._id}')">
                            <button class="btn btn-primary btn-sm" onclick="addComment('${p._id}')" style="white-space: nowrap;">Reply</button>
                        </div>
                    </div>
                </article>
                `;
            }).join('');
        }

        // Initialize on page load
        initTheme();
        fetchAllUsers();
    </script>
</body>
</html>
